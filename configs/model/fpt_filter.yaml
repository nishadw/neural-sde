# Exact grid-filter model: the progression coordinate's density is propagated on a grid with the forward
# Kolmogorov operator and multiplied by stage / photo emissions; exact marginal likelihood, no sampled posterior.
name: fpt_filter
horizon: ${horizon}
use_images: true
use_stages: true
drift_kind: mlp            # mlp | linear
sigma_kind: mlp            # mlp | const
monotone_drift: true
width: 32
clock: arrhenius           # arrhenius | group | fixed
clock_kwargs: {ea_j_mol: 50000.0, rate_ref: 0.473, t_ref_c: 20.0}
fixed_thresholds: false
link_scale: 0.5
learn_link_scale: true
min_sigma: 0.001
sigma_max: 1.0
mu_max: 2.0
kappa_max: 2.0
init_sigma: 0.3
z0_mean: 1.5               # prior on the progression start (stage units when thresholds are fixed), learnable
z0_std: 0.5
n_grid: 160
r_min: -1.0
ds: 0.02                   # physiological-time step of the forward propagator
n_pow: 11                  # propagator powers 2^0 .. 2^(n_pow-1): longest interval = ds * 2^n_pow physiological units
pde_ds: 0.02               # survival table used for forecasting
pde_steps: 2500
emission_width: 64
visit_dim: 32
