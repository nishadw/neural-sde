[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nsde"
version = "0.1.0"
description = "Neural SDEs in JAX: adjoint vs. backprop gradients, and a neural local-volatility calibration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nishad Wajge" }]
dependencies = [
  "jax>=0.4.30",
  "equinox>=0.11",
  "diffrax>=0.6",
  "optax>=0.2",
  "numpy",
  "scipy",
  "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
